---
# Mise à jour du cache APT et installation des paquets de base.
# Docker est installé séparément via tasks/docker.yml (groupes app et monitoring).

- name: Mise à jour du cache APT et upgrade des paquets
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 3600

- name: Installer Fail2ban (protection brute-force)
  ansible.builtin.apt:
    name: fail2ban
    state: present
