# Inventaire Ansible statique — fallback si Terraform non exécuté
#
# Usage :
#   cp inventory.example inventory.ini
#   Remplacer les IPs par les valeurs réelles de vos VMs
#
# En CI, cet inventaire est utilisé si l'artifact terraform_inventory
# n'est pas disponible (premier run, artifact expiré).
#
# L'inventaire dynamique généré par Terraform est préférable en prod.

[bastion]
bastion ansible_host=<BASTION_PUBLIC_IP>

[app]
app ansible_host=<APP_PRIVATE_IP> private_ip=<APP_PRIVATE_IP>

[monitoring]
monitoring ansible_host=<MONITORING_PRIVATE_IP> private_ip=<MONITORING_PRIVATE_IP>

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

[app:vars]
ansible_ssh_common_args='-o ProxyJump=ansible@<BASTION_PUBLIC_IP>'

[monitoring:vars]
ansible_ssh_common_args='-o ProxyJump=ansible@<BASTION_PUBLIC_IP>'
